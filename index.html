<html lang="en">

<title>Syed Muzakkir Pasha // Portfolio</title>

<style>
  :root {
    --bg-base: #050505;
    --bg-surface: #111111;
    --accent: #ccff00; /* Premium Acid Yellow */
    --accent-red: #ff3366;
    --text-main: #f4f4f5;
    --text-muted: #8b9bb4;
    --border: rgba(255, 255, 255, 0.1);
    --transition-slow: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    --transition-fast: all 0.3s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    overflow-x: hidden;
    cursor: none;
  }

  /* CUSTOM CURSOR */
  #cursor {
    position: fixed; top: 0; left: 0; width: 20px; height: 20px;
    background: var(--accent); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s, background-color 0.3s;
    mix-blend-mode: difference;
  }
  body:hover #cursor { width: 20px; height: 20px; }

  /* TYPOGRAPHY */
  h1, h2, h3, .display-font { font-family: 'Syne', sans-serif; text-transform: uppercase; }
  .font-mono { font-family: 'Space Mono', monospace; }
  
  .marquee-container {
    width: 100vw; overflow: hidden; white-space: nowrap;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 1rem 0; margin: 4rem 0; background: var(--bg-surface);
  }
  .marquee {
    display: inline-block; font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 4rem; color: transparent; -webkit-text-stroke: 1px var(--text-muted);
    animation: scroll 20s linear infinite;
  }
  .marquee span { padding: 0 2rem; color: var(--accent); -webkit-text-stroke: 0; }
  @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

  .section-label {
    font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--accent);
    letter-spacing: 2px; margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem;
    text-transform: uppercase;
  }
  .section-label::before { content: ''; width: 30px; height: 1px; background: var(--accent); }

  /* NAVIGATION */
  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    padding: 2rem 5%; display: flex; justify-content: space-between; align-items: center;
    mix-blend-mode: difference;
  }
  .nav-logo { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; color: #fff; }
  .nav-links { display: flex; gap: 3rem; list-style: none; }
  .nav-links a {
    font-size: 0.85rem; font-family: 'Space Mono', monospace; font-weight: 500; color: #fff; 
    text-decoration: none; text-transform: uppercase; letter-spacing: 1px; position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px;
    background: var(--accent); transition: var(--transition-fast);
  }
  .nav-links a:hover::after { width: 100%; }

  /* HERO SECTION */
  #hero {
    min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    padding: 0 5%; position: relative;
  }
  .hero-pre { color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem; letter-spacing: 2px; }
  .hero-title {
    font-size: clamp(3rem, 8vw, 8rem); line-height: 0.9; font-weight: 800;
    letter-spacing: -0.03em; margin-bottom: 1.5rem; color: #fff;
  }
  .hero-title span { color: var(--accent); }
  .hero-subtitle {
    max-width: 600px; font-size: 1.15rem; line-height: 1.7; color: var(--text-muted);
    margin-bottom: 3rem;
  }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 1.2rem 2.5rem; font-family: 'Space Mono', monospace; font-size: 0.85rem;
    letter-spacing: 1px; text-decoration: none; border-radius: 4px; text-transform: uppercase;
    transition: var(--transition-fast); cursor: none; font-weight: 700;
  }
  .btn-primary { background: var(--accent); color: var(--bg-base); }
  .btn-primary:hover { background: #fff; }
  .btn-secondary { color: #fff; border: 1px solid var(--border); background: transparent; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* SECTIONS & GRIDS */
  section { padding: 8rem 5%; max-width: 1600px; margin: 0 auto; }
  .section-header { font-size: clamp(2rem, 5vw, 4rem); font-weight: 700; margin-bottom: 4rem; }
  
  .bento-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1.5rem; }
  .card {
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 2.5rem; position: relative; overflow: hidden;
    transition: var(--transition-slow);
  }
  .card:hover { border-color: var(--accent); transform: translateY(-5px); }
  
  .card-about { grid-column: span 8; }
  .card-stat { grid-column: span 4; display: flex; flex-direction: column; justify-content: space-between; }
  .card-half { grid-column: span 6; }
  .card-full { grid-column: span 12; }

  /* CARD CONTENT */
  .tag {
    font-family: 'Space Mono', monospace; display: inline-block; padding: 0.4rem 1rem; border-radius: 50px;
    background: rgba(204, 255, 0, 0.1); color: var(--accent);
    font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 2rem;
  }
  .card h3 { font-size: 1.8rem; margin-bottom: 1rem; color: #fff; }
  .card p { color: var(--text-muted); line-height: 1.7; font-size: 1.05rem; }
  
  /* SKILLS */
  .skill-row { margin-bottom: 1.5rem; }
  .skill-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-family: 'Space Mono', monospace; font-size: 0.85rem;}
  .skill-track { height: 2px; background: var(--border); width: 100%; position: relative; }
  .skill-fill { position: absolute; top: -1px; left: 0; height: 4px; background: var(--accent); width: 0; transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); }

  /* GAMING STATS */
  .stat-row { display: flex; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid var(--border); }
